# Ambiente de teste local (spec 010, seção 8) — roda a MESMA imagem que vai pra produção,
# apontando pro Mongo Atlas / Azure Blob Storage do ambiente de teste (docker-compose.example.env).
# Uso: cp docker-compose.example.env .env && editar .env && docker compose up --build
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      PORT: 8080
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
